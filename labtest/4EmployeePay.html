<!DOCTYPE html>
<html>
<body>
<h3>Employee Payroll</h3>
<input id="name" placeholder="Enter Name">
<input type="number" id="basic" placeholder="Basic Salary">
<button onclick="calc()">Calculate</button>
<p id="result"></p>




<script>
class Employee {
    constructor(name,basic) {
        this.name = name;
        this.basic = basic;
    }
    netSalary() {
        let hra = this.basic*.20;
        let da = this.basic*.10;
        return this.basic+ hra+ da;   
    }
}

function calc() {
    let name = document.getElementById("name").value;
    let b = Number(document.getElementById("basic").value);
    if (b <= 0 || isNaN(b)|| name==="") {
        document.getElementById("result").innerText += "Enter valid values \n";
        return;
    }
    let emp = new Employee(name, b);
    document.getElementById("result").innerText +="Employe name: "+ emp.name+"  Net Salary: ₹" + emp.netSalary() + "\n";
}
</script>
</body>
</html>
