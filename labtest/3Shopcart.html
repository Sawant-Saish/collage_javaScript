<!DOCTYPE html>
<html>
<body>
<h3>Shopping Cart</h3>
<input type="text" id="name" placeholder="Product name">
<input type="number" id="price" placeholder="Price">
<button onclick="addItem()">Add</button>
<button onclick="total()">Total</button>
<p id="list"></p>
<p id="bill"></p>




<script>
let cart = [];
function addItem() {
    let n = document.getElementById("name").value;
    let p = Number(document.getElementById("price").value);
    if (n && p > 0) {
        cart.push({name: n, price: p});
        document.getElementById("list").innerText += n + " - ₹" + p + "\n";
    } else {
        document.getElementById("list").innerText = "Enter valid details";
    }
}

function total() {
    let sum = 0;
    for (let item of cart) {
        sum += item.price;
    }
    document.getElementById("bill").innerText = "Total: ₹" + sum;
}
</script>
</body>
</html>
